<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoIQ</title>
    <link rel="shortcut icon" href="./src/img/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/main.css">
    <link rel="stylesheet" href="./src/css/home.css">
    <link rel="stylesheet" href="./src/css/userpage.css">
    <link rel="stylesheet" href="./src/css/training-center.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karantina:wght@300;400;700&family=Squada+One&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header container">
        <div class="header__content">
            <a class="logo__link" href="./userpage.html">
                <img src="./src/img/lingoiq_logo.svg" alt="logo" class="logo__image">
            </a>
            <img class="header__lang-flag" src="./src/img/planet-earth.png" alt="Flag">
            <nav class="home-navigation">
                <ul class="home-navigation__list">
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./languagepage.html">Console</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./glossary.html">Glossary</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./rules.html">Rules</a>
                    </li>
                    <li class="home-navigation__item active-site">
                        <a class="home-navigation__link" href="./training-center.html">Training Center</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./statistic.html">Statistic</a>
                    </li>
                </ul>
            </nav>
            <div class="header__language">
                <button type="button" class="header__language-button" id="language-toggle-btn">
                    <img src="./src/img/language-icon.svg" alt="Language-button">
                </button>
                <!-- POPUP -->
                <div class="header-language-popup disable" id="language-popup">
                    <ul class="header-language-popup__list">
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button header-language-popup__button--active"
                                type="button" data-lang="en">
                                English
                            </button>
                        </li>
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button" type="button" data-lang="de">
                                Deutsch
                            </button>
                        </li>
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button" type="button" data-lang="uk">
                                Українська
                            </button>
                        </li>
                    </ul>
                </div>
                <!-- POPUP -->
            </div>
            <div class="header__user-block">
                <p class="header__username">Username</p>
                <button type="button" class="header__username-settings">
                    <img src="./src/img/userpage/avatar.svg" alt="icon" class="header__username-avatar">
                </button>
                <!-- POPUP -->
                <div class="user-info disable">
                    <button type="button" class="user-info__button-close">
                        <img class="user-info__button-close-icon" src="./src/img/close-icon.svg" alt="close">
                    </button>
                    <img class="user-info__img" src="./src/img/home/author-img.jpg" alt="User">
                    <div class="user-info__group">
                        <div class="user-info__user-section">
                            <h2 class="user-info__username">Loading...</h2>
                            <h2 class="user-info__language">Native language: <span id="nativlang"></span></h2>
                            <h2 class="user-info__days-learning">Days: <span id="daysLearning"></span></h2>
                            <button type="button" id="logout-btn" class="user-info__button-logout">Log Out</button>
                            <button type="button" class="user-info__button-edit" id="edit-profile-toggle-btn">
                                <img class="user-info__button-edit-icon" src="./src/img/userpage/edit-icon.svg"
                                    alt="edit">
                            </button>
                        </div>
                        <!-- Форма редагування профілю -->
                        <form class="user-info__edit-section disable" id="edit-user-info-form">
                            <label class="user-info__label" for="username-edit">
                                <input class="user-info__input" type="text" id="username-edit"
                                    placeholder="New Username">
                            </label>

                            <label class="user-info__label" for="native-lang-input">
                                <input class="user-info__input" list="languages-list" id="native-lang-input"
                                    placeholder="Search native language..." autocomplete="off">
                                <datalist id="languages-list"></datalist>
                            </label>

                            <div class="user-info__avatars-section">
                                <h2 class="user-info__avatars-title">Choose your avatar</h2>
                                <div class="user-info__avatars-grid">
                                    <img class="user-info__avatar-option active" src="./src/img/avatars/raccoon-1.jpeg" alt="Raccoon 1">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-2.jpeg" alt="Raccoon 2">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-3.jpeg" alt="Raccoon 3">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-4.jpeg" alt="Raccoon 4">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-5.jpeg" alt="Raccoon 5">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-6.jpeg" alt="Raccoon 6">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-7.jpeg" alt="Raccoon 7">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-8.jpeg" alt="Raccoon 8">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-9.jpeg" alt="Raccoon 9">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-10.jpeg" alt="Raccoon 10">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-11.jpeg" alt="Raccoon 11">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-12.jpeg" alt="Raccoon 12">
                                </div>
                            </div>
                            <div class="user-info__buttons-group">
                                <button class="user-info__submit" type="submit" id="edit-user-info-btn">Save</button>
                                <button class="user-info__button-cancel" type="button" id="cancel-edit-btn">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- POPUP -->
            </div>
        </div>
    </header>
    <main class="main">
        <div class="container main__content">
            <img src="./src/img/languagepage/training-center-icon.svg" alt="icon" class="training-center__icon">
            <h1 class="training-center__title">Training Center</h1>
            <div class="training-group"></div>

        <!-- POPUP -->
            <div class="training-console disable">
                <div class="training-console__info">
                    <button class="training-console__back-btn">← Back</button>
                    <h1 class="training-console__counter"><span id="training-console-number"></span>/<span id="training-console-total-number"></span></h1>
                    <h2 class="training-console__main-word"></h2>
                    <img class="training-console__repeating-icon" src="./src/img/training-center/cycle-icon.svg" alt="Cycle icon">
                    <div class="training-console__translation-element">
                        <img class="training-console__translation-cover-img" src="./src/img/training-center/translation-icon.svg" alt="Translation">
                        <h2 class="training-console__translation-word disable"></h2>
                    </div>
                    
                </div>
                <div class="training-console__buttons-group">
                    <button type="button" class="training-console__btn training-console__btn--known">
                        <img class="training-console__input-icon" src="./src/img/training-center/tick-icon-btn.svg" alt="tick">
                        <span>I know it</span>
                    </button>
                    <button type="button" class="training-console__btn training-console__btn--practice">
                        <img class="training-console__input-icon" src="./src/img/training-center/repeating-icon-btn.svg" alt="repeating">
                        <span>I need more practice</span>
                    </button>
                    <button type="button" class="training-console__btn training-console__btn--unknown">
                        <img class="training-console__input-icon" src="./src/img/training-center/cencel-icon-btn.svg" alt="cencel">
                        <span>I don't know it</span>
                    </button>
                </div>
            </div>

        </div>
    </main>
    <footer class="footer">
        <a href="#" class="footer-panel__loo-link">
            <img src="./src/img/lingoiq_logo-footer.svg" alt="logo" class="footer-panel__logo-img">
        </a>
        <div class="footer__social-media">
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/youtube.svg" alt="Youtube" class="footer__social-media-icon">
            </a>
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/github.svg" alt="GitHub" class="footer__social-media-icon">
            </a>
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/insta.svg" alt="Instagram" class="footer__social-media-icon">
            </a>
        </div>
        <div class="footer__politics-group">
            <p class="footer__copyrighting">© 2026 LingoIQ</p>
        </div>
    </footer>
    <script type="module" src="./src/js/training-center.js"></script>
</body>
</html>
