<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoIQ</title>
    <link rel="shortcut icon" href="./src/img/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/main.css">
    <link rel="stylesheet" href="./src/css/home.css">
    <link rel="stylesheet" href="./src/css/glossary.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karantina:wght@300;400;700&family=Squada+One&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header container">
        <div class="header__content">
            <a class="logo__link" href="./index.html">
                <img src="./src/img/lingoiq_logo.svg" alt="logo" class="logo__image">
            </a>
            <nav class="home-navigation">
                <ul class="home-navigation__list">
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./glossary.html">Home</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./glossary.html">Calendar</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./glossary.html">Languages</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./glossary.html">Websites</a>
                    </li>
                </ul>
            </nav>
            <div class="header__language">
                <button type="button" class="header__language-button">
                    <img src="./src/img/language-icon.svg" alt="Language-button">
                </button>
                <!-- POPUP -->
                <div class="header-language-popup disable">
                    <ul class="header-language-popup__list">
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button header-language-popup__button--active" type="button" id="English">English</button>
                        </li>
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button" type="button" id="German">German</button>
                        </li>
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button" type="button" id="Ukrainian">Ukrainian</button>
                        </li>
                    </ul>
                </div>
                <!-- POPUP -->
            </div>
            <div class="header__user-block">
                <p class="header__username">Username</p>
                <button type="button" class="header__username-settings">
                    <img src="./src/img/userpage/avatar.svg" alt="icon" class="header__username-avatar">
                </button>
                <!-- POPUP -->
                <div class="header__user-info disable">
                    <button class="header__user-info-button-close">
                        <img class="header__user-info-button-close-icon" src="./src/img/close-icon.svg" alt="close">
                    </button>
                    <img class="header__user-info-img" src="./src/img/home/author-img.jpg" alt="User">
                    <div class="user-info-group">
                        <h2 class="header__user-info-name">........</h2>
                        <p class="eader__user-info-days">--------</p>
                    </div>
                </div>
                <!-- POPUP -->
            </div>
        </div>
    </header>
    <main class="main">
        <div class="container main__content">
            <img src="./src/img/languagepage/glossary-icon.svg" alt="icon" class="glossary__icon">
            <h1 class="glossary__title">Glossary</h1>
            <table class="glossary-table">
                <thead class="glossary-table__header">
                    <tr class="glossary-table__header-tr">
                        <th class="glossary-table__header-th glossary-table__header-th--number">№</th>
                        <th class="glossary-table__header-th">Word</th>
                        <th class="glossary-table__header-th">Translation</th>
                        <th class="glossary-table__header-th">Typ</th>
                        <th class="glossary-table__header-th">Status</th>
                        <th class=" glossary-table__header-th-center">
                            <img src="./src/img/glossary/setting-icon.svg" alt="Setting" class="glossary-table__icon-setting">
                        </th>
                    </tr>
                </thead>
                <tbody class="glossary-table__body" id="glossary-table__body">
                                    <!-- Динамічні рядки будуть вставлятися сюди через JS -->
                    <tr class="glossary-table__body-tr">
                        <td class="glossary-table__body-td glossary-table__body-td--number">1</td>
                        <td class="glossary-table__body-td">der Hund</td>
                        <td class="glossary-table__body-td">the dog</td>
                        <td class="glossary-table__body-td">Substantiv</td>
                        <td class="glossary-table__body-td">
                            <span class="glossary-table__status glossary-table__status--studied">Studied</span>
                        </td>
                        <td class="glossary-table__body-td glossary-table__body-td-center">
                            <div class="glossary-table__body-btn-group">
                                <button class="glossary-table__body-btn--edit" data-id="1" type="button">
                                    <img src="./src/img/glossary/pen-icon.svg" alt="Pen" class="icon-pen">
                                </button>
                                <button class="glossary-table__body-btn--delete" data-id="1" type="button">
                                    <img src="./src/img/glossary/basket-icon.svg" alt="Basket" class="glossary-table__icon-basket">
                                </button>
                            </div>
                        </td>
                    </tr>
                                        <!-- Тестова статична строка 2 -->
                    <tr class="glossary-table__body-tr">
                        <td class="glossary-table__body-td glossary-table__body-td--number">2</td>
                        <td class="glossary-table__body-td">die Katze</td>
                        <td class="glossary-table__body-td">the cat</td>
                        <td class="glossary-table__body-td">Substantiv</td>
                        <td class="glossary-table__body-td">
                            <span class="glossary-table__status glossary-table__status--study">Study</span>
                        </td>
                        <td class="glossary-table__body-td glossary-table__body-td-center">
                            <div class="glossary-table__body-btn-group">
                                <button class="glossary-table__body-btn--edit" data-id="2" type="button">
                                    <img src="./src/img/glossary/pen-icon.svg" alt="Pen" class="icon-pen">
                                </button>
                                <button class="glossary-table__body-btn--delete" data-id="2" type="button">
                                    <img src="./src/img/glossary/basket-icon.svg" alt="Basket" class="glossary-table__icon-basket">
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
                <tfoot class="glossary-table__footer">
                    <tr class="glossary-table__footer-tr">
                        <td class="glossary-table__footer-td" colspan="6">
                            <button class="glossary-table__add-btn" id="glossary-table__add-btn" type="button">
                                <img src="./src/img/glossary/plus-icon.svg" alt="Plus" class="glossary-table__icon-plus">
                            </button>
                        </td>
                    </tr>
                    <tr class="glossary-form__tr">
                        <td class="glossary-table__body-td glossary-form__number">New</td>
                        <td class="glossary-table__body-td">
                            <input class="glossary-form__input" form="add-word-form" name="word" id="new-word" type="text" placeholder="Word">
                        </td>
                        <td class="glossary-table__body-td">
                            <input class="glossary-form__input" form="add-word-form" name="translation" id="new-translation" type="text" placeholder="Translation">
                        </td>
                        <td class="glossary-table__body-td">
                            <select class="glossary-form__select" form="add-word-form" name="typ" id="new-typ">
                                <option class="glossary-form__option" disabled selected hidden>Typ</option>
                                <option class="glossary-form__option" value="Noun">Noun</option>
                                <option class="glossary-form__option" value="Verb">Verb</option>
                                <option class="glossary-form__option" value="Adjective">Adjective</option>
                                <option class="glossary-form__option" value="Adverb">Adverb</option>
                                <option class="glossary-form__option" value="Pronoun">Pronoun</option>
                                <option class="glossary-form__option" value="Preposition">Preposition</option>
                                <option class="glossary-form__option" value="Conjunction">Conjunction</option>
                                <option class="glossary-form__option" value="Numeral">Numeral</option>
                                <option class="glossary-form__option" value="Interjection">Interjection</option>
                            </select>
                        </td>
                        <td class="glossary-table__body-td">
                            <select class="glossary-form__select" form="add-word-form" name="status" id="new-status">
                                <option class="glossary-form__option" disabled selected hidden>Status</option>
                                <option class="glossary-form__option glossary-select__option--studied" value="Studied">Studied</option>
                                <option class="glossary-form__option glossary-select__option--study" value="Study">Study</option>
                                <option class="glossary-form__option glossary-select__option--not-studied" value="Not Studied">Not Studied</option>
                            </select>
                        </td>
                        <td class="glossary-table__body-td glossary-table__body-td-center">
                            <form id="add-word-form" class="glossary-form__form">
                                <button class="glossary-form__btn-submit" type="submit">
                                    <img class="glossary-form__btn-icon" src="./src/img/glossary/plus.svg" alt="plus">
                                </button>
                                <button class="glossary-form__btn-cencel" type="button">Cencel</button>
                            </form>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>
    <footer class="footer">
        <a href="#" class="footer-panel__loo-link">
            <img src="./src/img/lingoiq_logo-footer.svg" alt="logo" class="footer-panel__logo-img">
        </a>
        <div class="footer__social-media">
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/youtube.svg" alt="Youtube" class="footer__social-media-icon">
            </a>
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/github.svg" alt="GitHub" class="footer__social-media-icon">
            </a>
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/insta.svg" alt="Instagram" class="footer__social-media-icon">
            </a>
        </div>
        <div class="footer__politics-group">
            <p class="footer__copyrighting">© 2026 LingoIQ</p>
            <ul class="footer__rules-list">
                <li class="footer__rules-item">
                    <a href="#" class="footer__rules-link">Privacy</a>
                </li>
                <li class="footer__rules-item">
                    <a href="#" class="footer__rules-link">Terms</a>
                </li>
                <li class="footer__rules-item">
                    <a href="#" class="footer__rules-link">Cookies</a>
                </li>
            </ul>
        </div>
    </footer>

    <!-- Потрібен PopUp для додавання нових слів -->

    <template id="glossary-table__row-template">
        <tr class="glossary-table__body-tr">
            <td class="glossary-table__body-td glossary-table__body-td--number" style="width: 25px; font-weight: 800;">{{number}}</td>
            <td class="glossary-table__body-td">{{word}}</td>
            <td class="glossary-table__body-td">{{translation}}</td>
            <td class="glossary-table__body-td">{{typ}}</td>
            <td class="glossary-table__body-td">
                <span class="glossary-table__status glossary-table__status--{{statusClass}}">{{status}}</span>
            </td>
            <td class="glossary-table__body-td glossary-table__body-td-center">
                <div class="glossary-table__body-btn-group">
                    <button class="glossary-table__body-btn--edit" data-id="{{id}}" type="button">
                        <img src="./src/img/glossary/pen-icon.svg" alt="Pen" class="icon-pen">
                    </button>
                    <button class="glossary-table__body-btn--delete" data-id="{{id}}" type="button">
                        <img src="./src/img/glossary/basket-icon.svg" alt="Basket" class="glossary-table__icon-basket">
                    </button>
                </div>
            </td>
        </tr>
    </template>
    <script type="module" src="./src/js/index.js"></script>
</body>
</html>
