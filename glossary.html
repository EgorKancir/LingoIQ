<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoIQ</title>
    <link rel="shortcut icon" href="./src/img/favicon.svg" type="image/x-icon">
    <link rel="stylesheet" href="./src/css/main.css">
    <link rel="stylesheet" href="./src/css/home.css">
    <link rel="stylesheet" href="./src/css/userpage.css">
    <link rel="stylesheet" href="./src/css/glossary.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Karantina:wght@300;400;700&family=Squada+One&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header container">
        <div class="header__content">
            <a class="logo__link" href="./userpage.html">
                <img src="./src/img/lingoiq_logo.svg" alt="logo" class="logo__image">
            </a>
            <img class="header__lang-flag" src="./src/img/planet-earth.png" alt="Flag">
            <nav class="home-navigation">
                <ul class="home-navigation__list">
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./languagepage.html" data-i18n="header.console">Console</a>
                    </li>
                    <li class="home-navigation__item active-site">
                        <a class="home-navigation__link" href="./glossary.html" data-i18n="header.glossary">Glossary</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./rules.html" data-i18n="header.rules">Rules</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./training-center.html" data-i18n="header.training-center">Training Center</a>
                    </li>
                    <li class="home-navigation__item">
                        <a class="home-navigation__link" href="./statistic.html" data-i18n="header.statistic">Statistic</a>
                    </li>
                </ul>
            </nav>
            <div class="header__language">
                <button type="button" class="header__language-button" id="language-toggle-btn">
                    <img src="./src/img/language-icon.svg" alt="Language-button">
                </button>
                <!-- POPUP -->
                <div class="header-language-popup disable" id="language-popup">
                    <ul class="header-language-popup__list">
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button header-language-popup__button--active"
                                type="button" data-lang="en">
                                English
                            </button>
                        </li>
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button" type="button" data-lang="de">
                                Deutsch
                            </button>
                        </li>
                        <li class="header-language-popup__item">
                            <button class="header-language-popup__button" type="button" data-lang="uk">
                                Українська
                            </button>
                        </li>
                    </ul>
                </div>
                <!-- POPUP -->
            </div>
            <div class="header__user-block">
                <p class="header__username">Username</p>
                <button type="button" class="header__username-settings">
                    <img src="./src/img/userpage/avatar.svg" alt="icon" class="header__username-avatar">
                </button>
                <!-- POPUP -->
                <div class="user-info disable">
                    <button type="button" class="user-info__button-close">
                        <img class="user-info__button-close-icon" src="./src/img/close-icon.svg" alt="close">
                    </button>
                    <img class="user-info__img" src="./src/img/home/author-img.jpg" alt="User">
                    <div class="user-info__group">
                        <div class="user-info__user-section">
                            <h2 class="user-info__username">Loading...</h2>
                            <h2 class="user-info__language"><span data-i18n="header.nativlang">Native language:</span> <span id="nativlang"></span></h2>
                            <h2 class="user-info__days-learning"><span data-i18n="header.days">Days:</span> <span id="daysLearning"></span></h2>
                            <button type="button" id="logout-btn" class="user-info__button-logout" data-i18n="header.log-out">Log Out</button>
                            <button type="button" class="user-info__button-edit" id="edit-profile-toggle-btn">
                                <img class="user-info__button-edit-icon" src="./src/img/userpage/edit-icon.svg"
                                    alt="edit">
                            </button>
                        </div>
                        <!-- Форма редагування профілю -->
                        <form class="user-info__edit-section disable" id="edit-user-info-form">
                            <label class="user-info__label" for="username-edit">
                                <input class="user-info__input" type="text" id="username-edit"
                                    placeholder="New Username"  data-i18n-placeholder="header.new-username">
                            </label>

                            <label class="user-info__label" for="native-lang-input">
                                <input class="user-info__input" list="languages-list" id="native-lang-input"
                                    placeholder="Search native language..." data-i18n-placeholder="header.search-native-lang" autocomplete="off">
                                <datalist id="languages-list"></datalist>
                            </label>

                            <div class="user-info__avatars-section">
                                <h2 class="user-info__avatars-title" data-i18n="header.choose-your-avatar">Choose your avatar</h2>
                                <div class="user-info__avatars-grid">
                                    <img class="user-info__avatar-option active" src="./src/img/avatars/raccoon-1.jpeg" alt="Raccoon 1">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-2.jpeg" alt="Raccoon 2">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-3.jpeg" alt="Raccoon 3">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-4.jpeg" alt="Raccoon 4">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-5.jpeg" alt="Raccoon 5">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-6.jpeg" alt="Raccoon 6">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-7.jpeg" alt="Raccoon 7">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-8.jpeg" alt="Raccoon 8">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-9.jpeg" alt="Raccoon 9">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-10.jpeg" alt="Raccoon 10">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-11.jpeg" alt="Raccoon 11">
                                    <img class="user-info__avatar-option" src="./src/img/avatars/raccoon-12.jpeg" alt="Raccoon 12">
                                </div>
                            </div>
                            <div class="user-info__buttons-group">
                                <button class="user-info__submit" type="submit" id="edit-user-info-btn" data-i18n="header.save">Save</button>
                                <button class="user-info__button-cancel" type="button" id="cancel-edit-btn" data-i18n="header.cancel">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
                <!-- POPUP -->
            </div>
        </div>
    </header>
    <main class="main">
        <div class="container main__content">
            <img src="./src/img/languagepage/glossary-icon.svg" alt="icon" class="glossary__icon">
            <h1 class="glossary__title" data-i18n="glossary.glossary">Glossary</h1>
            <table class="glossary-table">
                <thead class="glossary-table__header">
                    <tr class="glossary-table__header-tr">
                        <th class="glossary-table__header-th glossary-table__header-th--number">№</th>
                        <th class="glossary-table__header-th" data-i18n="glossary.word">Word</th>
                        <th class="glossary-table__header-th" data-i18n="glossary.translation">Translation</th>
                        <th class="glossary-table__header-th" data-i18n="glossary.typ">Typ</th>
                        <th class="glossary-table__header-th" data-i18n="glossary.status">Status</th>
                        <th class=" glossary-table__header-th-center">
                            <img src="./src/img/glossary/setting-icon.svg" alt="Setting" class="glossary-table__icon-setting">
                        </th>
                    </tr>
                </thead>
                <tbody class="glossary-table__body" id="glossary-table__body"></tbody>
                <tfoot class="glossary-table__footer">
                    <tr class="glossary-table__footer-tr">
                        <td class="glossary-table__footer-td" colspan="6">
                            <button class="glossary-table__add-btn" id="glossary-table__add-btn" type="button">
                                <img src="./src/img/glossary/plus-icon.svg" alt="Plus" class="glossary-table__icon-plus">
                            </button>
                        </td>
                    </tr>
                    <tr class="glossary-form__tr disable">
                        <td class="glossary-table__body-td glossary-form__number" data-i18n="glossary.new">New</td>
                        <td class="glossary-table__body-td">
                            <input class="glossary-form__input" form="add-word-form" name="word" id="new-word" type="text" placeholder="Word" data-i18n-placeholder="glossary.word">
                        </td>
                        <td class="glossary-table__body-td">
                            <input class="glossary-form__input" form="add-word-form" name="translation" id="new-translation" type="text" placeholder="Translation" data-i18n-placeholder="glossary.translation">
                        </td>
                        <td class="glossary-table__body-td">
                            <select class="glossary-form__select" form="add-word-form" name="typ" id="new-typ">
                                <option class="glossary-form__option" disabled selected hidden data-i18n="glossary.typ">Typ</option>
                                <option class="glossary-form__option" value="Noun" data-i18n="glossary.noun">Noun</option>
                                <option class="glossary-form__option" value="Verb" data-i18n="glossary.verb">Verb</option>
                                <option class="glossary-form__option" value="Adjective" data-i18n="glossary.adjective">Adjective</option>
                                <option class="glossary-form__option" value="Adverb" data-i18n="glossary.adverb">Adverb</option>
                                <option class="glossary-form__option" value="Pronoun" data-i18n="glossary.pronoun">Pronoun</option>
                                <option class="glossary-form__option" value="Preposition" data-i18n="glossary.preposition">Preposition</option>
                                <option class="glossary-form__option" value="Conjunction" data-i18n="glossary.conjunction">Conjunction</option>
                                <option class="glossary-form__option" value="Numeral" data-i18n="glossary.numeral">Numeral</option>
                                <option class="glossary-form__option" value="Interjection" data-i18n="glossary.interjection">Interjection</option>
                            </select>
                        </td>
                        <td class="glossary-table__body-td">
                            <select class="glossary-form__select" form="add-word-form" name="status" id="new-status">
                                <option class="glossary-form__option" disabled selected hidden data-i18n="glossary.status">Status</option>
                                <option class="glossary-form__option glossary-select__option--studied" value="Studied" data-i18n="glossary.studied">Studied</option>
                                <option class="glossary-form__option glossary-select__option--study" value="Study" data-i18n="glossary.study">Study</option>
                                <option class="glossary-form__option glossary-select__option--not-studied" value="Not Studied" data-i18n="glossary.not-studied">Not Studied</option>
                            </select>
                        </td>
                        <td class="glossary-table__body-td glossary-table__body-td-center">
                            <form id="add-word-form" class="glossary-form__form">
                                <button class="glossary-form__btn-submit" type="submit">
                                    <img class="glossary-form__btn-icon" src="./src/img/glossary/plus.svg" alt="plus">
                                </button>
                                <button class="glossary-form__btn-cencel" type="button" data-i18n="glossary.cancel">Cancel</button>
                            </form>
                        </td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </main>
    <footer class="footer">
        <a href="#" class="footer-panel__loo-link">
            <img src="./src/img/lingoiq_logo-footer.svg" alt="logo" class="footer-panel__logo-img">
        </a>
        <div class="footer__social-media">
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/youtube.svg" alt="Youtube" class="footer__social-media-icon">
            </a>
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/github.svg" alt="GitHub" class="footer__social-media-icon">
            </a>
            <a href="#" class="footer__social-media-link">
                <img src="./src/img/insta.svg" alt="Instagram" class="footer__social-media-icon">
            </a>
        </div>
        <div class="footer__politics-group">
            <p class="footer__copyrighting">© 2026 LingoIQ</p>
        </div>
    </footer>

    <!-- Потрібен PopUp для додавання нових слів -->

    <template id="glossary-table__row-template">
        <tr class="glossary-table__body-tr">
            <td class="glossary-table__body-td glossary-table__body-td--number" style="width: 25px; font-weight: 800;">{{number}}</td>
            <td class="glossary-table__body-td">{{word}}</td>
            <td class="glossary-table__body-td">{{translation}}</td>
            <td class="glossary-table__body-td">{{typ}}</td>
            <td class="glossary-table__body-td">
                <span class="glossary-table__status glossary-table__status--{{statusClass}}">{{status}}</span>
            </td>
            <td class="glossary-table__body-td glossary-table__body-td-center">
                <div class="glossary-table__body-btn-group">
                    <button class="glossary-table__body-btn--edit" data-id="{{id}}" type="button">
                        <img src="./src/img/glossary/pen-icon.svg" alt="Pen" class="icon-pen">
                    </button>
                    <button class="glossary-table__body-btn--delete" data-id="{{id}}" type="button">
                        <img src="./src/img/glossary/basket-icon.svg" alt="Basket" class="glossary-table__icon-basket">
                    </button>
                </div>
            </td>
        </tr>
    </template>
    <script type="module" src="./src/js/glossary.js"></script>
</body>
</html>
